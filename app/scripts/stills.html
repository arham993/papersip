<!doctype html>
<!-- Dev helper: open /papersip/scripts/stills.html under `npm run dev` to render the
     eight model stills (window.__stills holds PNG data URLs). Used to refresh public/thumbs. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Big Shoulders Display";font-weight:900;src:url(/papersip/fonts/bsd-900.woff2)}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(/papersip/fonts/plexmono-500.woff2)}
</style></head>
<body>
<script type="module">
import { renderStills } from '../src/three/scenes.js';
await Promise.all([document.fonts.load('900 60px "Big Shoulders Display"'), document.fonts.load('500 14px "IBM Plex Mono"')]);
window.__stills = renderStills();
</script>
</body></html>
